# SPDX-License-Identifier: MPL-2.0
# Pre-commit hooks for hyperpolymath RSR repos.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

# --- pre-commit.ci (the hosted runner) ---
# pre-commit.ci reads this file from the repo ROOT; the root
# .pre-commit-config.yaml is a symlink to this file (ci/README.adoc). The pre-commit
# framework itself ignores this block, so local runs are unchanged.
#   autofix_prs: false  pre-commit.ci never pushes a fix commit to a pull request
#                       (comment "pre-commit.ci autofix" to ask for one by hand).
#   skip                the three `language: system` hooks below need tools
#                       (nickel, jq, bun, a standards checkout) that the hosted
#                       runner does not provide. They still run wherever the
#                       framework runs locally; the deed and K9 checks also run in
#                       .github/hooks/pre-push, and `just validate-claude-md` runs
#                       the arrival-pack check.
ci:
  autofix_prs: false
  skip: [validate-deed, validate-k9, validate-claude-md]

repos:
  # --- Standard hooks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Licence texts are verbatim and owner-only: estate doctrine 6 (no
      # automated licence edits, ever). Root LICENSE* files and LICENSES/.
      - id: trailing-whitespace
        exclude: '^(LICENSE[^/]*|LICENSES/)'
      - id: end-of-file-fixer
        exclude: '^(LICENSE[^/]*|LICENSES/)'
      - id: check-yaml
      # devcontainer.json is JSONC (comments), which CLAUDE.md carves out of the
      # JSON policy ("Tool-demanded JSONC"); strict JSON parsing cannot read it.
      - id: check-json
        exclude: '(^|/)devcontainer\.json$'
      # The stapeln manifests hold {{TOKEN}} mint placeholders and are valid TOML
      # only after repo-init substitutes them.
      - id: check-toml
        exclude: '^build/container/stapeln/(manifest|compose|compose\.example)\.toml$'
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # --- Manifest validation (DEED grammar) ---
  # The former provider repo (hyperpolymath/a2ml-pre-commit) was DELETED
  # upstream in the A2ML retirement (standards #836 owner ruling; R-H3),
  # leaving this pin as broken plumbing — pre-commit could not clone it.
  # Replaced with a local hook calling .github/hooks/validate-deed.sh,
  # It validates every .deed file and rejects any .a2ml file (the format is
  # retired; its facts live in the repo deed). When the grammar-faithful .deed
  # validator is wired per owner ruling R-H2, this hook is its natural home.
  - repo: local
    hooks:
      - id: validate-deed
        name: Validate DEED manifests (and refuse retired .a2ml)
        entry: .github/hooks/validate-deed.sh
        language: system
        files: '\.(a2ml|A2ML|deed)$'
        pass_filenames: false

  # --- K9 contract validation ---
  # The canonical validator, through the same wrapper CI runs (needs a
  # standards checkout beside this repo, or STANDARDS_DIR; skips with a
  # notice otherwise).
  - repo: local
    hooks:
      - id: validate-k9
        name: Validate K9 contracts
        entry: bash .github/hooks/validate-k9.sh
        language: system
        pass_filenames: false
        files: '\.k9(\.(ncl|lock))?$'

  # --- Shell linting ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      # Mirror of .github/workflows/quality.yml, which runs `shellcheck -S error`:
      # the repo's policy is error severity only. Kept in step by
      # tests/shape/shellcheck_severity_lockstep_test.sh.
      - id: shellcheck
        args: [--severity=error]

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.2.1
    hooks:
      # -disable-indent-size drops only the indent-width multiple: continuation
      # and alignment lines in adoc/sh/yml/idr legitimately break it, and Idris
      # layout is significant. Indent style, trailing whitespace and the final
      # newline are still checked.
      - id: editorconfig-checker
        args: [-disable-indent-size]
        exclude: '(\.git|node_modules|target|_build|deps|\.|external_corpora|\.lake)/'

  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # --- Arrival pack drift: CLAUDE.md must stay in sync with the repo deed ---
  - repo: local
    hooks:
      - id: validate-claude-md
        name: CLAUDE.md arrival pack in sync with the repo deed
        entry: bash .machine_readable/arrival-pack/verify.sh
        language: system
        pass_filenames: false
        # Every commit, not a `files:` filter: the region also depends on the set
        # of tracked .a2ml files, and pre-commit passes no deleted path to a
        # filter, so a commit that only removes a legacy file would skip the
        # hook. This also covers the deed, the pack and scripts/deed-field.sh.
        always_run: true

# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# TEMPORARY DIAGNOSTIC. It lives only on a draft PR that is closed unmerged
# once it has answered its question; it must never reach main.
#
# Question: is the "Hypatia Neurosymbolic Analysis" crash (exit 139 in
# `hypatia-cli.sh scan`, OTP 28.5.0.8, hypatia be98f74) deterministic per
# scanned tree, and does OTP 27.3.4.19 scan the crashing tree cleanly?
# Evidence so far: PR #338's head (7821940) crashed on two attempts; main's
# head (f768fb0) and 29 other recent runs of hypatia-scan.yml were green.
# Each job scans one tree RUNS times with the same invocation hypatia-scan.yml
# uses (JSON format, --exit-zero, job token) and counts exit codes >= 128. The
# job never fails on a crash: the counts are the result.
name: "Hypatia scan segfault diagnosis (temporary)"

on:
  pull_request:
    paths: ['.github/workflows/hypatia-scan-diag.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repro:
    name: "Scan ${{ matrix.label }} on OTP ${{ matrix.otp }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
      vulnerability-alerts: read
    strategy:
      fail-fast: false
      matrix:
        otp: ['28.5.0.8', '27.3.4.19']
        subject:
          - 7821940a1a0c4d90303650a2ad3bbe9183f16a57
          - f768fb093c544ea6103c4441a777c3224f1b43f0
        include:
          - subject: 7821940a1a0c4d90303650a2ad3bbe9183f16a57
            label: pr338-crashed-7821940
          - subject: f768fb093c544ea6103c4441a777c3224f1b43f0
            label: main-green-f768fb0
    env:
      HYPATIA_SHA: 'be98f74ce93df200752f3798efa1305bfa3e0e10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.subject }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Elixir 1.19.4 / OTP ${{ matrix.otp }}
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: ${{ matrix.otp }}
      - name: Build pinned Hypatia scanner
        run: |
          set -euo pipefail
          git init "$HOME/hypatia"
          git -C "$HOME/hypatia" remote add origin https://github.com/hyperpolymath/hypatia.git
          git -C "$HOME/hypatia" fetch --depth=1 origin "$HYPATIA_SHA"
          git -C "$HOME/hypatia" checkout --detach FETCH_HEAD
          cd "$HOME/hypatia"
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          MIX_NO_PUBSUB=1 mix escript.build
          chmod +x hypatia hypatia-cli.sh
      - name: Install gdb for backtraces
        run: sudo apt-get install -y -qq gdb >/dev/null
      - name: Scan the tree repeatedly, keeping crash evidence
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNS: '10'
          LABEL: ${{ matrix.label }}
        run: |
          set -u
          out="$RUNNER_TEMP/diag"
          mkdir -p "$out/cores"
          sudo systemctl stop apport.service 2>/dev/null || true
          sudo sysctl -q -w kernel.core_pattern="$out/cores/core.%e.%p"
          ulimit -c unlimited
          {
            echo "label=$LABEL subject=$(git rev-parse HEAD) hypatia=$(git -C "$HOME/hypatia" rev-parse HEAD)"
            echo "core_pattern=$(cat /proc/sys/kernel/core_pattern) ulimit_c=$(ulimit -c)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
            erl -noshell -eval 'io:format("otp=~s erts=~s~n",[erlang:system_info(otp_release),erlang:system_info(version)]),halt().'
          } > "$out/runner.txt"
          crashes=0
          for i in $(seq 1 "$RUNS"); do
            rc=0
            HYPATIA_FORMAT=json "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero \
              > "$out/run-$i.json" 2> "$out/run-$i.err" || rc=$?
            echo "run $i rc=$rc" >> "$out/runs.txt"
            if [ "$rc" -ge 128 ]; then crashes=$((crashes + 1)); fi
          done
          beam="$(find "$INSTALL_DIR_FOR_OTP" -name beam.smp -type f -print -quit)"
          for c in "$out"/cores/core.*; do
            [ -f "$c" ] || continue
            gdb -batch -q -ex 'bt 40' -ex 'x/8i $pc' "$beam" "$c" > "$c.bt.txt" 2>&1 || true
            rm -f "$c"
          done
          {
            echo "### OTP ${{ matrix.otp }} on $LABEL: $crashes of $RUNS runs crashed"
            echo '```'
            cat "$out/runner.txt"
            awk '{ n[$3]++ } END { for (rc in n) printf "%4d  %s\n", n[rc], rc }' "$out/runs.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "crashes=$crashes of $RUNS"
      - name: Upload the evidence (backtraces, outputs; no raw cores)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypatia-diag-${{ matrix.otp }}-${{ matrix.label }}
          path: ${{ runner.temp }}/diag
          retention-days: 7
          if-no-files-found: warn

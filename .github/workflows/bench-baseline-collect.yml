# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# TEMPORARY COLLECTOR. It exists in the first commit of the re-baseline PR
# only; the second commit deletes it, so it never reaches main.
#
# Why: benches/baseline.json is stale. The escape_hatches workload scans the
# Idris2 corpus (src, verification, .machine_readable/coaptation). That corpus
# grew from 25500 to 38242 bytes (same 10 files) between the baseline's commit
# and main, so the gate now reads escape_hatches at 2.0x to 2.05x its baseline
# ratio and fails main (limit 2.0x). CI keeps no bench JSON, so a baseline
# measured on CI runners needs new runs.
#
# What: three runners each run `benches/template_bench.sh --json .` four times
# on this tree (12 documents; compute-bench-baseline.sh needs at least 10) and
# print each document as one `BENCHJSON <job-id> <n> <json>` line. The job
# never fails on a slow run: the printed documents are the result.
name: "Bench baseline collector (temporary)"

on:
  pull_request:
    paths: ['.github/workflows/bench-baseline-collect.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    name: "Collect bench runs on runner ${{ matrix.replica }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Run the benchmark four times and print each document
        env:
          JOB_ID: ${{ job.check_run_id }}
        run: |
          set -u
          echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          for n in 1 2 3 4; do
            rc=0
            doc="$(bash benches/template_bench.sh --json . 2>/dev/null)" || rc=$?
            echo "BENCHJSON ${JOB_ID} ${n} rc=${rc} ${doc}"
          done

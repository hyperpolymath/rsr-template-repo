# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Standalone Hypatia security scan for push, weekly schedule, and manual
# dispatch. Pull-request Hypatia scanning and grid comment posting run once in
# `.github/workflows/fork-governance.yml` per metadatastician/standards
# `3-practice/fork-governance/ADOPTION.adoc` §3 ("One PR, one scan").
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read      # required by the reusable workflow (staleness check reads workflow runs)
  contents: read
  security-events: write

jobs:
  hypatia:
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}

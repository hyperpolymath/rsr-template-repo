# SPDX-License-Identifier: MPL-2.0
# CI gate — thin caller of the estate's interim gate, which lives in
# hyperpolymath/proven-cicd-and-workflows as a reusable workflow. Do not copy
# its jobs in here: a copy freezes at one cicd-suite commit and never receives
# a fix.
#
# It emits the commit status `CI/gate`, which the Branch-Floor ruleset
# requires. It is a COMMIT STATUS, not a check run, because a job inside a
# reusable workflow gets the check-run name `<caller job> / <called job>`,
# which always contains " / " and can never equal `CI/gate`.
#
# It runs from the DEFAULT branch via workflow_run, so a pull request cannot
# alter this file, its pin or its list. The consequence: the PR that adds this
# caller can never receive `CI/gate` itself, and must be merged past the gate
# once (owner action).
#
# The required-check list is NOT in this repository: it lives in
# proven-cicd-and-workflows/profiles/ci-gate/<owner>/<repo>.json at the pinned
# SHA below, selected by github.repository.
#
# Scheduled sweep: every 15 minutes (cron 7,22,37,52, off the hour to avoid the
# top-of-hour load) the schedule re-evaluates CI/gate for the open pull request
# heads and the default branch. This BOUNDS, but does not eliminate, a stale
# status: statuses are last-writer-wins, and GitHub may delay or skip scheduled
# runs. `pull-requests: read` is needed to list the open pull requests.
#
# The job id MUST stay `gate`. The pin is a full SHA, never `@main` or a tag:
# the account enforces sha_pinning_required. An A3 `estate-gate` replaces this
# interim gate by changing ONE pin and ONE context (`with: context`) here.
#
# Trigger types: `completed` re-evaluates a finished workflow; `in_progress`
# flips the status to pending when a rerun starts, so a stale success never
# survives a rerun.
#
# ONBOARDED in actions.lock (workflow key plus a leaf dependency record for the
# suite reusable) because this repository's lock-sync gate requires every
# job-level reusable ref to be keyed there; see the suite README, "Consumers
# with a lock-sync gate". The record's ref is the symbolic `main`, never the SHA.
#
# No `concurrency:` block: the reusable re-fetches before every status write, so
# per-SHA serialisation would only delay the in_progress pending status.
#
# No `secrets:` line: the reusable consumes none.
name: CI gate

on:
  pull_request:
  workflow_run:
    workflows: ["**", "!CI gate"]
    types: [completed, in_progress]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
permissions: {statuses: write, actions: read, contents: read, pull-requests: read}
jobs:
  gate:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'CI gate')
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/ci-gate.yml@d49708186e7234c2e1bcce2ceda7aed44a64c08d # cicd-suite ci-gate
    with: {context: "CI/gate"}
  # The pull_request start (permanent). workflow_run, schedule and workflow_dispatch run only from the
  # default branch, so without this job the pull request that adds or changes the gate never gets the
  # status and the ruleset blocks it. It runs from the pull request's own branch and posts the same
  # verdict, waiting (bounded) for the profile's checks to report. Same-repository branches only:
  # fork and Dependabot tokens cannot write statuses, those are covered by the workflow_run job.
  # No trust decision uses github.actor. A pull request can edit this file, so the Gate tamper guard
  # (ci-gate-tamper-guard.yml, run from the default branch) fails a pull request that touches gate files
  # unless the owner has approved it.
  gate-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/ci-gate.yml@d49708186e7234c2e1bcce2ceda7aed44a64c08d # cicd-suite ci-gate
    with: {context: "CI/gate"}

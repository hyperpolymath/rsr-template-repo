# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# GitHub Pages via casket-ssg (hyperpolymath's pure-Haskell static site generator).
# Replaces the orphan one-off Pages deployment with a reproducible build.
name: GitHub Pages

# Deployed AFTER Dogfood Gate completes on main, because the site now carries
# badges/k9.json (the README's live K9 badge). There is one Pages site per
# repository and a deployment replaces it wholesale, so the badge has to be part
# of THE deployment; a second, earlier deploy from a bare push would erase it.
# This also means a manual workflow_dispatch is gone: re-run Dogfood Gate on
# main to redeploy. Pages deployments are not branch writes, so this satisfies
# the Branch-Floor ruleset (which refused the old governance-badges branch).
on:
  workflow_run:
    workflows: ["Dogfood Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Serialise Pages deploys; never cancel an in-flight deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Only main pushes (never a PR or fork run), and not a cancelled gate run:
    # a cancelled run staged nothing trustworthy to deploy.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion != 'cancelled'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout casket-ssg
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/casket-ssg
          path: .casket-ssg

      - name: Setup GHCup
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: '9.8.2'
          cabal-version: '3.10'

      - name: Cache Cabal
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            .casket-ssg/dist-newstyle
          key: ${{ runner.os }}-casket-${{ hashFiles('.casket-ssg/casket-ssg.cabal') }}

      - name: Build casket-ssg
        working-directory: .casket-ssg
        run: cabal build

      - name: Build site
        run: |
          mkdir -p site _site
          # Seed site/index.md from README if the author hasn't provided one.
          if [ ! -f site/index.md ]; then
            {
              echo "---"
              echo "title: $(basename "$PWD")"
              echo "date: $(date +%Y-%m-%d)"
              echo "---"
              if [ -f README.adoc ]; then cat README.adoc
              elif [ -f README.md ]; then cat README.md
              else printf '\n# %s\n\nDocumentation coming soon.\n' "$(basename "$PWD")"
              fi
            } > site/index.md
          fi
          cd .casket-ssg && cabal run casket-ssg -- build ../site ../_site

      # The badge was staged by the gate's `badges` job from the lane result and
      # evidence. A missing artifact fails this job loudly: deploying the site
      # without it would silently delete the live badge.
      - name: Fetch the staged badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: governance-badge-site
          path: ${{ runner.temp }}/governance-badge-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Add the badge to the site
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/governance-badge-site/badges/k9.json"
          mkdir -p _site/badges
          cp "$RUNNER_TEMP/governance-badge-site/badges/k9.json" _site/badges/k9.json
          cat _site/badges/k9.json

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'

  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Central Estate CI/CD Audit

# The called reusable declares `permissions: contents: read`; a caller must grant
# at least what the reusable declares, and this grants exactly that — no more.
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  call-estate-audit:
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@main  # cross-repo reusable calls aren't lockfile-pinnable (gh actions-lock: no entry, 'All 1 workflow valid'); enforcement lives in the callee's own actions.lock, and cicd-suite main is audit-gated green on every push

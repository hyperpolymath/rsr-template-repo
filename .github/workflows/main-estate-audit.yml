name: Central Estate CI/CD Audit

# The called reusable declares `permissions: contents: read`; a caller must grant
# at least what the reusable declares, and this grants exactly that — no more.
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  call-estate-audit:
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@98f405a8c50b60f372065c200a5583d3ae664903  # cicd-suite main, lockfile-compliant (cicd-suite#14); reusable calls are not lock-coverable (gh actions-lock writes no entry), so SHA-pin per scripts/check-action-pinning.js

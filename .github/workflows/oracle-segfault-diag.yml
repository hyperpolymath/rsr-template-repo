# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# TEMPORARY DIAGNOSTIC. This file lives only on a draft PR that is closed
# unmerged once it has answered its question; it must never reach main.
#
# Question: the dogfood gate's "RSR oracle" job still segfaults (exit 139) in
# `mix hypatia.rsr_score` on OTP 28.5.0.8 (erts 16.4.0.7), the version PR #311
# chose because a matrix run found it clean. Evidence so far:
#   - main run 43139798509 (af8665c): segfault.
#   - main run 43143942303 (a55669e, a descendant of af8665c): passed.
#   - main run 43134505952: failed on attempt 1, passed on attempt 2.
#   - PR #331 (head 6ad5378): failed twice.
# Is the crash random (VM) or tied to the tree being scored? And where in the
# emulator does it die on 28.5.0.8?
#
# Method: score each of the three trees RUNS times per job, on REPLICAS runners
# each, with the oracle job's exact pins (standards e064539, Hypatia be98f74,
# Elixir 1.19.4 / OTP 28.5.0.8, same cache key). Per-tree crash counts that
# differ far beyond the per-runner spread point at content; similar counts
# point at the VM. On a crash, keep a gdb backtrace of beam.smp and record the
# runner's CPU model and flags (the JIT emits CPU-specific code). The job never
# fails on a crash: the counts and backtraces are the result.
name: "Oracle segfault diagnosis (temporary)"

on:
  pull_request:
    paths: ['.github/workflows/oracle-segfault-diag.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repro:
    name: "Oracle repro ${{ matrix.label }} #${{ matrix.replica }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
        subject:
          - af8665c406e4080edc353754b70e82f4ba8357f2
          - a55669ec1eb460d247fd590536d057d3aa449bd9
          - 6ad53789dcc29acdd12f57581a7bc59594a0e566
        include:
          - subject: af8665c406e4080edc353754b70e82f4ba8357f2
            label: main-failed-af8665c
          - subject: a55669ec1eb460d247fd590536d057d3aa449bd9
            label: main-passed-a55669e
          - subject: 6ad53789dcc29acdd12f57581a7bc59594a0e566
            label: pr331-failed-6ad5378
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.subject }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: e064539116c2dcfdf282a4749dbd58c69961c7e6
          path: _standards
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/hypatia
          ref: be98f74ce93df200752f3798efa1305bfa3e0e10
          path: _hypatia
          persist-credentials: false
      - name: Setup Elixir 1.19.4 / OTP 28.5.0.8 (the oracle job's pins)
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.5.0.8'
      - name: Cache Hypatia Mix deps and build (the oracle job's key)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _hypatia/deps
            _hypatia/_build
            ~/.hex
            ~/.mix
          key: hypatia-oracle-${{ runner.os }}-otp28.5.0.8-elx1194-be98f74ce93df200752f3798efa1305bfa3e0e10
      - name: Compile the oracle
        working-directory: _hypatia
        run: mix local.hex --force && mix local.rebar --force && mix deps.get && mix compile
      - name: Install gdb for backtraces
        run: sudo apt-get install -y -qq gdb >/dev/null
      - name: Score the tree repeatedly, keeping crash evidence
        working-directory: _hypatia
        env:
          RUNS: '20'
          LABEL: ${{ matrix.label }}
          REPLICA: ${{ matrix.replica }}
        run: |
          set -u
          out="$RUNNER_TEMP/diag"
          mkdir -p "$out/cores"
          sudo sysctl -q -w kernel.core_pattern="$out/cores/core.%e.%p"
          ulimit -c unlimited
          {
            echo "label=$LABEL replica=$REPLICA subject=$(git -C ../subject rev-parse HEAD)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
            echo "flags=$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2-)"
            echo "kernel=$(uname -r)"
            erl -noshell -eval 'io:format("otp=~s erts=~s jit=~p~n",[erlang:system_info(otp_release),erlang:system_info(version),erlang:system_info(emu_flavor)]),halt().'
          } > "$out/runner.txt"
          crashes=0
          for i in $(seq 1 "$RUNS"); do
            rc=0
            mix hypatia.rsr_score ../subject \
              --ssot ../_standards/0-canon/rsr/rsr-criteria-v2.a2ml \
              > "$out/run-$i.txt" 2>&1 || rc=$?
            echo "run $i rc=$rc" >> "$out/runs.txt"
            if [ "$rc" -ge 128 ]; then crashes=$((crashes + 1)); fi
          done
          beam="$(find "$INSTALL_DIR_FOR_OTP" -name beam.smp -type f -print -quit)"
          for c in "$out"/cores/core.*; do
            [ -f "$c" ] || continue
            gdb -batch -q -ex 'bt 40' -ex 'info registers rip rsp' -ex 'x/8i $pc' -ex 'info sharedlibrary' \
              "$beam" "$c" > "$c.bt.txt" 2>&1 || true
            rm -f "$c"
          done
          {
            echo "### $LABEL replica $REPLICA: $crashes of $RUNS runs crashed"
            echo '```'
            cat "$out/runner.txt"
            awk '{ n[$3]++ } END { for (rc in n) printf "%4d  %s\n", n[rc], rc }' "$out/runs.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "crashes=$crashes of $RUNS"
      - name: Upload the evidence (backtraces, outputs; no raw cores)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-diag-${{ matrix.label }}-${{ matrix.replica }}
          path: ${{ runner.temp }}/diag
          retention-days: 7
          if-no-files-found: warn
      - name: Show the first crash's backtrace and output in the log
        if: always()
        run: |
          out="$RUNNER_TEMP/diag"
          echo "--- run-1 output (tail) ---"; tail -n 40 "$out/run-1.txt" || true
          bt="$(find "$out/cores" -name '*.bt.txt' -print -quit)"
          if [ -n "$bt" ]; then
            echo "--- crashing thread first, then the rest: $bt ---"
            grep -v -e 'JITed symbol file' -e '^\[New LWP' "$bt" | head -n 120
          else
            echo "no backtrace recorded"
          fi
